name: Memoba CI
on:
  pull_request:
  push:
    branches: [main, codex/local-v0]
permissions:
  contents: read
jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      DEMO_EMAIL: pm@memoba.local
      GOOGLE_GENERATIVE_AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start native Supabase
        run: npx supabase start --runtime native --output-format json > "$RUNNER_TEMP/supabase-start.json"
      - run: npx supabase migration up --local
      - run: npm run test:db
      - run: npm run db:configure
      - name: Generate local-only demo password
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV,"DEMO_PASSWORD="+require("node:crypto").randomBytes(24).toString("hex")+"\n")'
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Stop native Supabase
        if: always()
        run: npx supabase stop
