<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0}</style></head><body><title>Memoba Engine Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the landing's ruled column. One canvas diagram with the existing five-step controls, in three visual worlds. Light only, as the product is. */
:root{--bg:#fff;--ink:#131416;--doc:#20282c;--case:#1b6c80;--muted:#f4f6f8;--sub:#5d5f60;--line:#d5d9dd;--m:clamp(16px,3vw,40px);
--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sys);-webkit-font-smoothing:antialiased}
h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--case);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;border-inline:1px solid var(--line)}
.mono{font:500 12px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;padding:0 var(--m);font-weight:600;font-size:18px;letter-spacing:-.02em;min-height:56px}
.brand i{width:11px;height:11px;background:var(--case);border-radius:50%}.brand i+i{background:var(--doc);border-radius:0;margin-left:-5px;margin-right:3px}
.tabs{display:flex;margin-left:auto;flex:1 1 560px;max-width:820px}
.tabs button{flex:1;min-height:56px;background:#fff;border:0;border-left:1px solid var(--line);padding:8px 14px;text-align:left;display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.25}
.tabs b{font:500 12px/1 var(--mono)}
.tabs button[aria-selected=true]{background:var(--doc);color:#fff}
.pitch{padding:14px var(--m);border-bottom:1px solid var(--line);color:var(--sub);font-size:15px;background:var(--muted)}
.pitch b{color:var(--ink);font-weight:600}
.sec{padding-block:clamp(32px,4vw,56px);padding-left:max(var(--m),env(safe-area-inset-left,0px));padding-right:max(var(--m),env(safe-area-inset-right,0px))}
.tag{display:flex;gap:12px;margin-bottom:20px;color:var(--sub)}.tag span:first-child{color:var(--ink)}
.intro{display:grid;grid-template-columns:7fr 5fr;gap:32px;align-items:end;margin-bottom:32px}
h2{font-size:clamp(30px,3.8vw,48px);line-height:1.1;letter-spacing:-.03em;font-weight:500;max-width:14em;text-wrap:balance}
.board{border:1px solid var(--line);line-height:0}
canvas{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:12px;font-size:14px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;background:var(--doc)}.legend i.c{background:var(--case);border-radius:50%}
.now{margin-top:16px;min-height:92px}
.stepno{color:var(--sub)}
.stepcap{margin-top:6px;max-width:42em;font-size:clamp(18px,2vw,22px);line-height:1.35;letter-spacing:-.01em}
.prog,.ctl{display:flex;margin-top:12px}
.prog button,.ctl button{height:44px;min-width:44px;padding:0 14px;background:#fff;border:1px solid var(--line);margin-left:-1px}
.prog button{flex:1;display:flex;gap:8px;align-items:center;justify-content:center}
.prog button:first-child,.ctl button:first-child{margin-left:0}
.prog button[aria-current=step]{background:var(--doc);border-color:var(--doc);color:#fff}
.ctl button:disabled{color:#9aa0a6;cursor:default}
@media (max-width:900px){.tabs{flex-basis:100%;max-width:none}.tabs button{border-top:1px solid var(--line);padding:8px 10px;gap:6px;font-size:13px}.tabs button:first-child{border-left:0}.intro{grid-template-columns:minmax(0,1fr)}.prog{display:none}.ctl button{flex:1}.stepcap{font-size:16px}.now{min-height:96px}}
@media (max-width:1360px){.wrap{border-inline:0}}
</style>

<header class="bar"><div class="wrap">
  <div class="brand"><i></i><i></i>Memoba</div>
  <div class="tabs" role="tablist" aria-label="Design options">
    <button role="tab" id="tab-a" data-v="a"><b>A</b>Radar</button>
    <button role="tab" id="tab-b" data-v="b"><b>B</b>Isometric world</button>
    <button role="tab" id="tab-c" data-v="c"><b>C</b>Poster machine</button>
  </div>
</div></header>
<main><div class="wrap">
<p class="pitch" id="pitch"></p>
<section class="sec">
  <div class="intro">
    <div><p class="tag mono"><span>04 / 07</span><span>How it answers</span></p><h2>A chatbot answers from what it's given. Memoba goes and reads.</h2></div>
    <p>The model chooses what to search and read. The application holds the limits and checks every citation.</p>
  </div>
  <div class="board"><canvas id="cv" role="img"></canvas></div>
  <p class="legend"><span><i class="c"></i>Case: what happened</span><span><i></i>Document: what is required</span></p>
  <div class="now"><p class="stepno mono" id="no"></p><p class="stepcap" id="cap"></p></div>
  <div class="prog mono" id="prog" role="group" aria-label="Steps"></div>
  <div class="ctl mono"><button id="back" type="button">Back</button><button id="play" type="button">Pause</button><button id="next" type="button">Next</button></div>
</section>
</div></main>

<script>
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d");

/* Same five steps, captions and clock as src/components/landing/engine-timeline.ts */
const steps = [
  ["A chatbot","Chatbot","A chatbot answers from whatever text is pushed into it, so the model is full and the answer can't be opened to check."],
  ["Give it a tool","Tool","Give the same model a search tool and it goes to the team's cases and documents itself, by keyword and by meaning."],
  ["Filter before reading","Filter","Many sources shrink to a short list and only a few are opened, so the model holds just what it read."],
  ["The application keeps the rules","Rules","The model decides what to look at. The application decides how far it may look, when it stops, and checks every citation."],
  ["Room to grow","Extend","The same frame has room to grow: three planned sockets for tools, working methods and permissions."],
];
const stepS = [5.5,5.5,8.4,7,6];
const docs = new Set([2,7,11,14,19,22]), shortI = [1,4,7,9,14,18], openI = [4,9,7];
const M = Array.from({length:24},(_,i)=>({i,doc:docs.has(i),sh:shortI.indexOf(i),op:openI.indexOf(i)}));
const SOCK = [["MCP","Connects the team's tools"],["Skills","Teaches how work is done"],["Permission","Who may do what"]];

const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg = (t,a,b)=>cl((t-a)/(b-a));
const lerp = (a,b,t)=>a+(b-a)*t;
const eio = (t)=>t<.5?2*t*t:1-(-2*t+2)**2/2;
const eo = (t)=>1-(1-t)**3;
const bounce = (t)=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;};
const back = (t)=>1+2.7*(t-1)**3+1.7*(t-1)**2;
function T(s,x,y,o={}){g.save();g.globalAlpha*=o.al??1;g.font=`${o.w??600} ${(o.s??14)*(F.tall?1.28:1)}px ${o.m?'"IBM Plex Mono",ui-monospace,monospace':'-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif'}`;g.fillStyle=o.c??"#131416";g.textAlign=o.a??"left";g.textBaseline=o.b??"alphabetic";if(o.m&&g.letterSpacing!==undefined)g.letterSpacing=".6px";g.fillText(s,x,y);g.restore();}
function chip(t,x,y,o={}){const sz=(o.s??13)*(F.tall?1.28:1);g.save();g.font=`${o.w??600} ${sz}px -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif`;const w=g.measureText(t).width+12,h=sz+9,bx=o.a==="right"?x-w:o.a==="center"?x-w/2:x;g.globalAlpha*=o.al??1;g.fillStyle="rgba(255,255,255,.93)";g.fillRect(bx,y-h+5,w,h);g.fillStyle=o.c??"#131416";g.textAlign="left";g.fillText(t,bx+6,y);g.restore();}
function mark(x,y,s,doc,al=1,c,stroke){g.save();g.globalAlpha*=al;g.fillStyle=c??(doc?"#20282c":"#1b6c80");if(doc){g.beginPath();g.rect(x-s,y-s,s*2,s*2);}else{g.beginPath();g.arc(x,y,s,0,7);}g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke();}g.restore();}
function line(pts,c,w=2,dash){g.save();g.strokeStyle=c;g.lineWidth=w;if(dash)g.setLineDash(dash);g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.restore();}
function along(pts,f){let L=0;const d=pts.slice(1).map((p,i)=>{const l=Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]);L+=l;return l;});let r=f*L;for(let i=0;i<d.length;i++){if(r<=d[i]||i===d.length-1){const k=d[i]?r/d[i]:0;return[lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)];}r-=d[i];}}
function flow(pts,c,n=3,sz=4){for(let i=0;i<n;i++){const [x,y]=along(pts,(F.now*.45+i/n)%1);g.fillStyle=c;g.beginPath();g.arc(x,y,sz,0,7);g.fill();}}
function box2(x,y,w,h,f,s,lw=2){if(f){g.fillStyle=f;g.fillRect(x,y,w,h);}if(s){g.strokeStyle=s;g.lineWidth=lw;g.strokeRect(x,y,w,h);}}
function hatch(x,y,w,h,c){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.strokeStyle=c;g.lineWidth=1.5;for(let i=-h;i<w;i+=11){g.beginPath();g.moveTo(x+i,y+h);g.lineTo(x+i+h,y);g.stroke();}g.restore();}
function lock(x,y,c){g.save();g.strokeStyle=c;g.fillStyle=c;g.lineWidth=2.5;g.beginPath();g.arc(x,y-5,5.5,Math.PI,0);g.stroke();g.fillRect(x-8,y-5,16,12);g.restore();}
function stopSign(x,y,r,c="#e5484d"){g.fillStyle=c;g.beginPath();for(let i=0;i<8;i++){const a=Math.PI/8+i*Math.PI/4;g[i?"lineTo":"moveTo"](x+r*Math.cos(a),y+r*Math.sin(a));}g.closePath();g.fill();g.fillStyle="#fff";g.fillRect(x-r*.55,y-r*.14,r*1.1,r*.28);}

/* F carries the frame: step (1-5), t seconds in step, u progress, a short list, b opened, v(n) entrance of the layer that step n adds. */
let F = {};
function frame(step,t,now,tall){
  const u=cl(t/stepS[step-1]);
  F={step,t,u,now,tall,a:step<3?0:step>3?1:eio(seg(u,.22,.4)),b:step<3?0:step>3?1:eio(seg(u,.56,.74)),
     v:(n,d=1)=>step>n?1:step===n?eo(cl(t/d)):0,on:(n)=>step>=n};
}
const holdSub=()=>F.step===1?"Everything it was given":F.step===2?"Only the question, so far":F.a<1&&F.step===3?"Only the question, so far":"Only what it opened and read";

/* A: radar. Knowledge orbits the model, search sweeps it, and sources move ring by ring toward the centre. */
const A = {
  size:(tall)=>tall?[520,800]:[1200,680],
  draw(){
    const {tall,now,step,a,b,v}=F, [W,H]=this.size(tall);
    const P=tall?{cx:260,cy:400,r3:200,r2:128,r1:82,core:48,wall:164}:{cx:600,cy:340,r3:262,r2:172,r1:112,core:64,wall:220};
    const {cx,cy,r3,r2,r1,core,wall}=P;
    g.fillStyle="#e3f1f4";g.fillRect(0,0,W,H);
    [[r3+46,"#d3e9ee"],[r3-26,"#c0dfe6"],[(r2+r1)/2+30,"#a9d3dd"]].forEach(([r,c])=>{g.fillStyle=c;g.beginPath();g.arc(cx,cy,r,0,7);g.fill();});
    g.strokeStyle="rgba(19,20,22,.16)";g.lineWidth=1;for(let i=0;i<72;i++){const q=i/72*6.283,r=r3+46;g.beginPath();g.moveTo(cx+r*Math.cos(q),cy+r*Math.sin(q));g.lineTo(cx+(r-(i%6?5:11))*Math.cos(q),cy+(r-(i%6?5:11))*Math.sin(q));g.stroke();}
    const q0=tall?[cx,30]:[28,cy], an0=tall?[cx,H-40]:[W-28,cy];
    const Q=tall?{x:cx-100,y:16,w:200,h:58}:{x:34,y:cy-40,w:176,h:80}, An=tall?{x:cx-100,y:H-74,w:200,h:58}:{x:W-210,y:cy-40,w:176,h:80};
    const inL=tall?[[cx,Q.y+Q.h],[cx,cy-core]]:[[Q.x+Q.w,cy],[cx-core,cy]], outL=tall?[[cx,cy+core],[cx,An.y]]:[[cx+core,cy],[An.x,cy]];
    line(inL,"#20282c",2);line(outL,"#20282c",2);
    flow(inL,"#20282c",3,4);
    /* sweep */
    const sweep=step===2?1:step===3?1-F.a:0, ang=now*1.9;
    if(sweep>0&&g.createConicGradient){const gr=g.createConicGradient(ang-1.1,cx,cy);gr.addColorStop(0,"rgba(255,183,3,0)");gr.addColorStop(.175,"rgba(255,183,3,.75)");gr.addColorStop(.1751,"rgba(255,183,3,0)");gr.addColorStop(1,"rgba(255,183,3,0)");g.save();g.globalAlpha=sweep;g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r3+46,0,7);g.fill();g.restore();line([[cx,cy],[cx+(r3+46)*Math.cos(ang),cy+(r3+46)*Math.sin(ang)]],"#e09f00",2.5);}
    /* marks */
    const skip=tall?0:-.0,slotsS=(tall?[-155,-115,-65,-25,25,155]:[-150,-110,-70,-30,30,150]).map(d=>d*Math.PI/180),slotsO=(tall?[-135,-90,-45]:[-130,-90,-50]).map(d=>d*Math.PI/180);
    M.forEach((m)=>{
      let th=m.i/24*6.283+now*.05+skip, r=r3, s=tall?9:12, al=step===1?.28:1;
      if(m.sh>=0){const k=eio(cl(F.a));const dth=((slotsS[m.sh]-th+Math.PI)%6.283+6.283)%6.283-Math.PI;th+=dth*k;r=lerp(r3,r2,k);}
      else al*=lerp(1,.16,F.a);
      if(m.op>=0){const dth=((slotsO[m.op]-th+Math.PI)%6.283+6.283)%6.283-Math.PI;th+=dth*b;r=lerp(r,r1,b);s*=lerp(1,1.55,b);}
      else if(m.sh>=0)al*=lerp(1,.45,b);
      if(sweep>0){const dd=((ang-th)%6.283+6.283)%6.283;if(dd<.5){s*=1+.5*(1-dd/.5)*sweep;}}
      mark(cx+r*Math.cos(th),cy+r*Math.sin(th),s,m.doc,al,null,"#fff");
    });
    /* pushed text */
    if(step===1){for(let i=0;i<6;i++){const f=(now*.5+i/6)%1,y=lerp(-16,cy-core,f),w=[120,84,104,70,110,92][i];g.fillStyle=`rgba(32,40,44,${.8*(1-f*.4)})`;g.fillRect(cx-w/2,y,w,9);}}
    /* wall */
    const wv=v(4,1.3);
    if(wv>0){g.save();g.strokeStyle="#131416";g.lineWidth=7;g.beginPath();g.arc(cx,cy,wall,-Math.PI/2,-Math.PI/2+6.283*wv);g.stroke();g.restore();
      const hy=cy-wall;box2(cx-74,hy-13,148,26,"#131416");T("THE APPLICATION",cx,hy+4.5,{c:"#fff",s:tall?8.6:11,a:"center",m:1,w:500,al:cl(wv*2)});}
    /* core */
    const fill=step===1?lerp(.15,1,seg(F.u,0,.5)):lerp(.16,.56,b), col=step===1?"#e5484d":"#2c8aa1";
    g.save();g.beginPath();g.arc(cx,cy,core,0,7);g.clip();g.fillStyle="#131416";g.fillRect(cx-core,cy-core,core*2,core*2);g.fillStyle=col;g.beginPath();const fy=cy+core-core*2*fill;g.moveTo(cx-core,cy+core);for(let x=-core;x<=core;x+=4)g.lineTo(cx+x,fy+Math.sin(x*.09+now*3.5)*(step===1?5:2.5));g.lineTo(cx+core,cy+core);g.fill();g.restore();
    if(step>=1){g.save();g.strokeStyle=col;g.globalAlpha=.5+.3*Math.sin(now*3);g.lineWidth=3;g.beginPath();g.arc(cx,cy,core+7+2*Math.sin(now*3),0,7);g.stroke();g.restore();}
    T("Model",cx,cy+1,{c:"#fff",s:tall?13:17,a:"center"});T("decides what to read",cx,cy+(tall?15:18),{c:"#fff",s:tall?7.2:10.5,a:"center",w:500});
    /* nodes */
    box2(Q.x,Q.y,Q.w,Q.h,"#fff","#131416",2.5);T("Question",Q.x+Q.w/2,Q.y+Q.h/2-1,{s:tall?12.5:16,a:"center"});T("asked in plain words",Q.x+Q.w/2,Q.y+Q.h/2+(tall?16:19),{s:tall?9.5:12.5,a:"center",w:500,c:"#5d5f60"});
    const op=step>3||(step===3&&b>=1);
    box2(An.x,An.y,An.w,An.h,op?"#fff":"#eef1f3","#131416",2.5);if(!op)hatch(An.x,An.y,An.w,An.h,"rgba(19,20,22,.1)");
    T("Answer",An.x+An.w/2,An.y+An.h/2-1,{s:tall?12.5:16,a:"center"});T(op?"Citations you can open":"Can't be opened to check",An.x+An.w/2,An.y+An.h/2+(tall?16:19),{s:tall?9.5:12.5,a:"center",w:500,c:op?"#1b6c80":"#5d5f60"});
    if(!op)lock(An.x+An.w-18,An.y+18,"#5d5f60");
    if(op&&!tall){[0,1,2].forEach((i)=>mark(An.x+56+i*26,An.y+An.h+22,7,i===2));T("Open to check",An.x+An.w/2+8,An.y+An.h+50,{s:12.5,w:500,a:"center",c:"#5d5f60"});}
    if(step===3&&b>.5){flow(outL,"#1b6c80",3,5);}else if(step>=4){flow(outL,"#1b6c80",3,5);}else if(step===1)flow(outL,"#e5484d",2,4);
    /* search */
    if(step>=2&&step<4){const sl=tall?[cx+core*.7,cy+core*.7]:[cx+core*.7,cy+core*.7];}
    /* labels */
    const lx=tall?18:34, ly=tall?104:48;
    if(!tall||step>=1){T("What the model is holding",lx,ly,{s:tall?9.5:12.5,w:600,c:"#5d5f60"});T(holdSub(),lx,ly+(tall?15:20),{s:tall?11:15});}
    T("Cases and documents",tall?W-18:W-34,ly,{s:tall?9.5:13,a:"right",al:step===1?.6:1});T("by keyword and by meaning",tall?W-18:W-34,ly+(tall?15:19),{s:tall?9:12.5,a:"right",w:500,c:"#5d5f60",al:step>=2?1:0});
    const lb=cl(F.a*3);if(lb>0){T("Short list",cx,cy+r2+(tall?5:6),{s:tall?9:12.5,a:"center",al:lb});T("Opened and read",cx,cy+r1+(tall?4:1),{s:tall?8:11.5,a:"center",al:F.b});}
    /* rules */
    const rv=v(4,1.8);
    if(wv>=.2&&step>=4){const gx=tall?cx:cx+wall, gy=tall?cy+wall:cy, al=cl((F.step===4?F.t:9)-.7);
      g.save();g.globalAlpha=al;g.fillStyle="#131416";tall?g.fillRect(gx-32,gy-7,64,14):g.fillRect(gx-7,gy-32,14,64);
      T("Every citation",tall?gx+40:gx+12,tall?gy-2:gy+50,{s:tall?9:12.5});T("checked",tall?gx+40:gx+12,tall?gy+11:gy+66,{s:tall?9:12.5});
      const c=(step===4?(F.t-1.6)%2.7:(F.t%3)),k=cl(c/.9);if(c>=0){const hit=lerp(core,wall-8,eio(k)),back2=c>.9?eio(cl((c-.9)/.8))*(wall-core-20):0,d=hit-back2;mark(tall?cx:cx+d,tall?cy+d:cy,tall?6:8,true,c>1.7?0:1,"#e5484d");}
      T("Cites something unread",tall?gx-40:gx+12,tall?gy+13:gy-44,{s:tall?9:12.5,c:"#c9282d",a:tall?"right":"left"});
      const sa=-Math.PI/4;const sx=cx+wall*Math.cos(sa),sy=cy+wall*Math.sin(sa);stopSign(sx,sy,tall?11:15);T("When it must stop",sx+(tall?15:22),sy-(tall?9:10),{s:tall?9.5:12.5});
      const ra=Math.PI*1.2,rx=cx+wall*Math.cos(ra),ry=cy+wall*Math.sin(ra);g.save();g.translate(rx,ry);g.rotate(ra);g.fillStyle="#131416";g.fillRect(-20,-9,40,18);g.restore();T("How far it may look",rx-(tall?24:20),ry-(tall?8:10),{s:tall?9.5:12.5,a:"right"});g.restore();}
